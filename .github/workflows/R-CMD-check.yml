# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      R_KEEP_PKG_SOURCE: yes
      R_PROFILE_USER: ""
      R_ENVIRON_USER: ""
      RENV_CONFIG_AUTOLOAD_ENABLED: "FALSE"
      RENV_CONFIG_USER_PROFILE: "FALSE"

    steps:
      - uses: actions/checkout@v4

      - name: Disable project .Rprofile in CI
        shell: bash
        run: |
          rm -f .Rprofile

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"note"'

      - name: Prevent use of utils::globalVariables
        if: success()
        run: |
          if [ -f "R/global.R" ]; then
            echo "::error file=R/global.R::Found R/global.R file. Please use .data, .env, or {{ }} instead of utils::globalVariables()"
            exit 1
          fi

          if grep -r "utils::globalVariables\|globalVariables" R/ --include="*.R" --exclude="global.R"; then
            echo "::error::Found utils::globalVariables() in code. Please use .data, .env, or {{ }} for proper tidyverse NSE handling"
            exit 1
          fi
        shell: bash